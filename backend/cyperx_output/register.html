<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BabyShop Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BabyShop Hub</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li id="auth-links">
                    <a href="login.html" id="login-link">Login</a>
                    <a href="register.html" id="register-link">Register</a>
                </li>
                <li id="user-greeting" style="display:none;">
                    Welcome, <span id="user-name"></span>!
                    <button id="logout-btn">Logout</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Create a New Account</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <p id="register-message" class="message"></p>
        <p>Already have an account? <a href="login.html">Login here</a>.</p>
    </main>

    <footer>
        <p>&copy; 2023 BabyShop Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthLinks();
            const registerForm = document.getElementById('register-form');
            const registerMessage = document.getElementById('register-message');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const response = await registerUser(name, email, password);
                if (response.success) {
                    registerMessage.textContent = 'Registration successful! Please login.';
                    registerMessage.style.color = 'green';
                    registerForm.reset();
                } else {
                    registerMessage.textContent = `Registration failed: ${response.message}`;
                    registerMessage.style.color = 'red';
                }
            });
        });
    </script>
</body>
</html>
