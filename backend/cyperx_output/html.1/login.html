<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BabyShop Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BabyShop Hub</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li id="auth-links">
                    <a href="login.html" id="login-link">Login</a>
                    <a href="register.html" id="register-link">Register</a>
                </li>
                <li id="user-greeting" style="display:none;">
                    Welcome, <span id="user-name"></span>!
                    <button id="logout-btn">Logout</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Login to Your Account</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p id="login-message" class="message"></p>
        <p>Don't have an account? <a href="register.html">Register here</a>.</p>
    </main>

    <footer>
        <p>&copy; 2023 BabyShop Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthLinks();
            const loginForm = document.getElementById('login-form');
            const loginMessage = document.getElementById('login-message');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const response = await loginUser(email, password);
                if (response.success) {
                    loginMessage.textContent = 'Login successful! Redirecting...';
                    loginMessage.style.color = 'green';
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirect to home or dashboard
                    }, 1000);
                } else {
                    loginMessage.textContent = `Login failed: ${response.message}`;
                    loginMessage.style.color = 'red';
                }
            });
        });
    </script>
</body>
</html>
