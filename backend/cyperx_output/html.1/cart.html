<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - BabyShop Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BabyShop Hub</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li id="auth-links">
                    <a href="login.html" id="login-link">Login</a>
                    <a href="register.html" id="register-link">Register</a>
                </li>
                <li id="user-greeting" style="display:none;">
                    Welcome, <span id="user-name"></span>!
                    <button id="logout-btn">Logout</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Your Shopping Cart</h2>
        <div id="cart-container">
            <p id="cart-message" class="message"></p>
            <ul id="cart-items"></ul>
            <div id="cart-summary">
                <strong>Total: $<span id="cart-total-cost">0.00</span></strong>
            </div>
            <div id="cart-actions">
                <button id="clear-cart-btn">Clear Cart</button>
                <button id="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 BabyShop Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            updateAuthLinks();
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('jwtToken');

            if (!userId || !token) {
                document.getElementById('cart-container').innerHTML = '<p>Please login to view your cart.</p>';
                return;
            }

            await loadCart(userId, token);

            document.getElementById('clear-cart-btn').addEventListener('click', async () => {
                if (confirm('Are you sure you want to clear your cart?')) {
                    const response = await clearUserCart(userId, token);
                    if (response.success) {
                        alert('Cart cleared successfully!');
                        await loadCart(userId, token);
                    } else {
                        alert(`Failed to clear cart: ${response.message}`);
                    }
                }
            });

            document.getElementById('checkout-btn').addEventListener('click', () => {
                alert('Checkout functionality is not yet implemented.');
            });
        });

        async function loadCart(userId, token) {
            const cartItemsList = document.getElementById('cart-items');
            const cartTotalCost = document.getElementById('cart-total-cost');
            const cartMessage = document.getElementById('cart-message');
            cartItemsList.innerHTML = '';
            cartMessage.textContent = '';
            cartTotalCost.textContent = '0.00';

            const cartResponse = await getCart(userId, token);

            if (cartResponse.success && cartResponse.data) {
                const cart = cartResponse.data;
                if (cart.cartItems && cart.cartItems.length > 0) {
                    cart.cartItems.forEach(item => {
                        const listItem = document.createElement('li');
                        listItem.innerHTML = `
                            <span>${item.product.name} (x${item.quantity}) - $${(item.product.price * item.quantity).toFixed(2)}</span>
                            <div class="cart-item-actions">
                                <input type="number" value="${item.quantity}" min="1" data-product-id="${item.product.id}" class="quantity-input">
                                <button class="update-quantity-btn" data-product-id="${item.product.id}">Update</button>
                                <button class="remove-from-cart-btn" data-product-id="${item.product.id}">Remove</button>
                            </div>
                        `;
                        cartItemsList.appendChild(listItem);
                    });
                    cartTotalCost.textContent = cart.totalCost.toFixed(2);

                    document.querySelectorAll('.update-quantity-btn').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const productId = e.target.dataset.productId;
                            const newQuantity = e.target.previousElementSibling.value;
                            const response = await updateProductQuantityInCart(userId, productId, newQuantity, token);
                            if (response.success) {
                                alert('Cart updated!');
                                await loadCart(userId, token); // Reload cart
                            } else {
                                alert(`Failed to update quantity: ${response.message}`);
                            }
                        });
                    });

                    document.querySelectorAll('.remove-from-cart-btn').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const productId = e.target.dataset.productId;
                            if (confirm('Are you sure you want to remove this item?')) {
                                const response = await removeProductFromCart(userId, productId, token);
                                if (response.success) {
                                    alert('Item removed from cart!');
                                    await loadCart(userId, token); // Reload cart
                                } else {
                                    alert(`Failed to remove item: ${response.message}`);
                                }
                            }
                        });
                    });

                } else {
                    cartMessage.textContent = 'Your cart is empty.';
                    document.getElementById('cart-actions').style.display = 'none';
                    document.getElementById('cart-summary').style.display = 'none';
                }
            } else if (cartResponse.message === 'Cart not found for user.') {
                cartMessage.textContent = 'Your cart is empty.';
                document.getElementById('cart-actions').style.display = 'none';
                document.getElementById('cart-summary').style.display = 'none';
            }
             else {
                cartMessage.textContent = `Error loading cart: ${cartResponse.message}`;
                cartMessage.style.color = 'red';
            }
        }
    </script>
</body>
</html>
